workflows:
  medivault-ios-app-store:
    name: MediVault iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - appstore_credentials
      vars:
        APP_STORE_APPLE_ID: "6795470938"
        BUNDLE_ID: in.yogeshaihub.medivault
        XCODE_SCHEME: MediVault
        XCODE_WORKSPACE: MediVault.xcworkspace
      node: 22.14.0
      xcode: 16.4
      cocoapods: default

    scripts:
      - name: Install JavaScript dependencies
        script: |
          cd "$CM_BUILD_DIR/medivault-native"
          npm ci

      - name: Generate the native iOS project
        script: |
          cd "$CM_BUILD_DIR/medivault-native"
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        script: |
          cd "$CM_BUILD_DIR/medivault-native/ios"
          pod install

      - name: Configure App Store signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates
          cd "$CM_BUILD_DIR/medivault-native"
          xcode-project use-profiles --project ios/*.xcodeproj

      - name: Set the App Store build number
        script: |
          cd "$CM_BUILD_DIR/medivault-native/ios"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Build the signed IPA
        script: |
          cd "$CM_BUILD_DIR/medivault-native"
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - medivault-native/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: false
