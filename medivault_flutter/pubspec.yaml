name: medivault_flutter
description: "MediVault - Unified Health Records, Longitudinal Biomarkers & AI Diagnostic Vault for iOS and Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  dio: ^5.4.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  fl_chart: ^0.66.2
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  share_plus: ^8.0.2
  google_fonts: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
