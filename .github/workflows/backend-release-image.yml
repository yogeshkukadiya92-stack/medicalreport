name: Backend release image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-release-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the production runtime image
        run: docker build --tag medivault-backend:${{ github.sha }} medivault-web
      - name: Verify bundled PDF renderer worker
        run: docker run --rm --entrypoint node medivault-backend:${{ github.sha }} -e 'const fs=require("fs");fs.accessSync("/app/node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs");console.log("PDF worker packaged")'
      - name: Verify text rendering without operating-system fonts
        run: |
          docker run --rm --entrypoint node -v "$PWD/medivault-web/tests/fixtures/synthetic-report.pdf:/tmp/synthetic-report.pdf:ro" medivault-backend:${{ github.sha }} --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            import {createCanvas, DOMMatrix, ImageData, Path2D} from "@napi-rs/canvas";
            Object.assign(globalThis,{DOMMatrix,ImageData,Path2D});
            const {getDocument}=await import("pdfjs-dist/legacy/build/pdf.mjs");
            const pdf=await getDocument({data:new Uint8Array(fs.readFileSync("/tmp/synthetic-report.pdf")),standardFontDataUrl:"/app/node_modules/pdfjs-dist/standard_fonts/",useSystemFonts:false,disableFontFace:true,isEvalSupported:false}).promise;
            const page=await pdf.getPage(1),viewport=page.getViewport({scale:2});
            const canvas=createCanvas(Math.ceil(viewport.width),Math.ceil(viewport.height));
            const context=canvas.getContext("2d");
            await page.render({canvasContext:context,viewport}).promise;
            const pixels=context.getImageData(0,0,canvas.width,canvas.height).data;
            let ink=0;for(let i=0;i<pixels.length;i+=4)if(pixels[i]<100&&pixels[i+1]<100&&pixels[i+2]<100)ink++;
            assert.ok(ink>1000,"Standard PDF text must render inside the production container");
            console.log("PDF text rendered:",ink,"dark pixels");await pdf.destroy();'
      - name: Exercise the production image with isolated synthetic data
        shell: bash
        run: |
          set -euo pipefail
          docker network create medivault-ci
          docker run -d --name medivault-ci-db --network medivault-ci mongo:7
          for attempt in {1..30}; do
            if docker exec medivault-ci-db mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec medivault-ci-db mongosh medivault_ci --quiet --eval 'db.authUsers.insertOne({id:"ci-test-user",phone:"9876543210",email:"qa@example.test",name:"Synthetic QA",accountStatus:"active",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),passwordHash:"unused",passwordSalt:"unused",passwordIterations:210000})'
          docker exec medivault-ci-db mongosh medivault_ci --quiet --eval 'const id=ObjectId("000000000000000000000001"); db.reportFiles.files.insertOne({_id:id,length:7,chunkSize:261120,uploadDate:new Date(),filename:"other-fixture.txt",metadata:{userId:"ci-other-user"}}); db.reportFiles.chunks.insertOne({files_id:id,n:0,data:BinData(0,"UFJJVkFURQ==")}); db.labReports.insertOne({id:"ci-other-report",fileId:id.toString(),normalizedClientPhone:"9876543211",status:"published",title:"Unrelated synthetic report",values:[],reportType:"Medical",labName:"Synthetic QA",createdAt:new Date().toISOString(),parameters:0})'
          docker run -d --name medivault-ci-api --network medivault-ci -p 127.0.0.1:3300:3000 -e MONGODB_URI=mongodb://medivault-ci-db:27017 -e MONGODB_DB=medivault_ci -e AUTH_TEST_LOGIN_ENABLED=true -e AUTH_TEST_PHONE_NUMBERS=9876543210 medivault-backend:${{ github.sha }}
          node medivault-web/scripts/smoke-production-image.cjs
      - name: Print runtime diagnostics on failure
        if: failure()
        run: docker logs medivault-ci-api || true
      - name: Export image
        run: docker save medivault-backend:${{ github.sha }} | gzip > medivault-backend-image.tar.gz
      - name: Save deployment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: medivault-backend-image
          path: medivault-backend-image.tar.gz
          retention-days: 1
          compression-level: 0
